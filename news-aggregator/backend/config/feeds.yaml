# Editable feed list. No code changes needed to add/remove/disable a source.
#
# Fields:
#   name       - display name of the source
#   feed_url   - RSS/Atom URL
#   language   - "en" or "hi"
#   category   - default/primary category (see categories.yaml for the taxonomy);
#                items are still auto re-tagged by keyword rules on ingest
#   enabled    - set to false to temporarily disable a feed without deleting it
#
# If a feed URL goes stale (outlets change RSS paths often), the ingestion
# pipeline logs the failure and skips it — it will not crash the whole run.
# Fix or replace the URL here; no other code needs to change.

sources:
  # --- India news / politics / policy ---------------------------------
  - name: PIB (Press Information Bureau) - All Releases
    feed_url: "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3"
    language: en
    category: india_politics_policy
    enabled: true

  - name: The Hindu - National
    feed_url: "https://www.thehindu.com/news/national/feeder/default.rss"
    language: en
    category: india_politics_policy
    enabled: true

  - name: Indian Express - India
    feed_url: "https://indianexpress.com/section/india/feed/"
    language: en
